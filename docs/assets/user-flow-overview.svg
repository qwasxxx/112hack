<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Основные пользовательские потоки sys112-trainer</title>
  <desc id="desc">Три дорожки показывают путь студента, преподавателя и администратора через единое приложение.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#16263b"/></linearGradient>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#8bdcf2"/></marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".25"/></filter>
    <style>
      .ttl{font:700 42px Arial,sans-serif;fill:#f8fafc}.sub2{font:400 20px Arial,sans-serif;fill:#b7c8db}.lane{fill:#10233a;stroke:#375779;stroke-width:2;rx:24}.role{font:700 25px Arial,sans-serif;fill:#f8fafc}.hint{font:400 15px Arial,sans-serif;fill:#9fb5ca}.node{fill:#17304d;stroke:#4d7197;stroke-width:2;rx:18}.student{fill:#113e52;stroke:#22d3ee}.teacher{fill:#29234e;stroke:#a78bfa}.admin{fill:#173c34;stroke:#34d399}.n1{font:700 18px Arial,sans-serif;fill:#f8fafc}.n2{font:400 14px Arial,sans-serif;fill:#c4d4e4}.edge{fill:none;stroke:#8bdcf2;stroke-width:3;marker-end:url(#arr2)}.sync{fill:#0d1c2f;stroke:#54708d;stroke-width:2;rx:18}.badge{font:700 13px Arial,sans-serif;fill:#07131f}.bc{fill:#8bdcf2}.legend{font:400 15px Arial,sans-serif;fill:#c4d4e4}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <text x="70" y="68" class="ttl">User Flow sys112-trainer</text>
  <text x="70" y="104" class="sub2">Фактические маршруты трёх ролей через единый интерфейс localhost:5173</text>

  <rect x="55" y="145" width="1810" height="235" class="lane"/>
  <text x="85" y="188" class="role">Студент</text><text x="85" y="215" class="hint">Цель: пройти сценарий и получить разбор</text>
  <rect x="85" y="245" width="185" height="95" class="node student" filter="url(#sh2)"/><text x="112" y="282" class="n1">Вход</text><text x="112" y="311" class="n2">роль STUDENT</text>
  <rect x="330" y="245" width="220" height="95" class="node student" filter="url(#sh2)"/><text x="357" y="282" class="n1">Направление</text><text x="357" y="311" class="n2">Оператор 112 / ДДС</text>
  <rect x="610" y="245" width="205" height="95" class="node student" filter="url(#sh2)"/><text x="637" y="282" class="n1">Каталог</text><text x="637" y="311" class="n2">фильтр или назначение</text>
  <rect x="875" y="245" width="205" height="95" class="node student" filter="url(#sh2)"/><text x="902" y="282" class="n1">Брифинг</text><text x="902" y="311" class="n2">цель и памятка</text>
  <rect x="1140" y="245" width="240" height="95" class="node student" filter="url(#sh2)"/><text x="1167" y="282" class="n1">Тренировка</text><text x="1167" y="311" class="n2">АРМ-112 / ДДС / экзамен</text>
  <rect x="1440" y="245" width="185" height="95" class="node student" filter="url(#sh2)"/><text x="1467" y="282" class="n1">Разбор</text><text x="1467" y="311" class="n2">балл и ошибки</text>
  <rect x="1685" y="245" width="145" height="95" class="node student" filter="url(#sh2)"/><text x="1712" y="282" class="n1">История</text><text x="1712" y="311" class="n2">результаты</text>
  <path d="M270 292H330M550 292H610M815 292H875M1080 292H1140M1380 292H1440M1625 292H1685" class="edge"/>

  <rect x="55" y="420" width="1810" height="235" class="lane"/>
  <text x="85" y="463" class="role">Преподаватель</text><text x="85" y="490" class="hint">Цель: подготовить, наблюдать и подтвердить результат</text>
  <rect x="85" y="520" width="185" height="95" class="node teacher" filter="url(#sh2)"/><text x="112" y="557" class="n1">Вход</text><text x="112" y="586" class="n2">роль TEACHER</text>
  <rect x="330" y="520" width="220" height="95" class="node teacher" filter="url(#sh2)"/><text x="357" y="557" class="n1">Сценарии</text><text x="357" y="586" class="n2">выбор и конструктор</text>
  <rect x="610" y="520" width="205" height="95" class="node teacher" filter="url(#sh2)"/><text x="637" y="557" class="n1">Назначение</text><text x="637" y="586" class="n2">категории и билеты</text>
  <rect x="875" y="520" width="205" height="95" class="node teacher" filter="url(#sh2)"/><text x="902" y="557" class="n1">Старт занятия</text><text x="902" y="586" class="n2">группа активна</text>
  <rect x="1140" y="520" width="240" height="95" class="node teacher" filter="url(#sh2)"/><text x="1167" y="557" class="n1">Наблюдение</text><text x="1167" y="586" class="n2">прогресс и вмешательство</text>
  <rect x="1440" y="520" width="185" height="95" class="node teacher" filter="url(#sh2)"/><text x="1467" y="557" class="n1">Проверка</text><text x="1467" y="586" class="n2">запись и критерии</text>
  <rect x="1685" y="520" width="145" height="95" class="node teacher" filter="url(#sh2)"/><text x="1712" y="557" class="n1">Экспорт</text><text x="1712" y="586" class="n2">XLSX / CSV</text>
  <path d="M270 567H330M550 567H610M815 567H875M1080 567H1140M1380 567H1440M1625 567H1685" class="edge"/>

  <rect x="55" y="695" width="1810" height="235" class="lane"/>
  <text x="85" y="738" class="role">Администратор</text><text x="85" y="765" class="hint">Цель: поддерживать доступ и готовность учебного контура</text>
  <rect x="85" y="795" width="185" height="95" class="node admin" filter="url(#sh2)"/><text x="112" y="832" class="n1">Вход</text><text x="112" y="861" class="n2">роль ADMIN</text>
  <rect x="330" y="795" width="220" height="95" class="node admin" filter="url(#sh2)"/><text x="357" y="832" class="n1">Обзор</text><text x="357" y="861" class="n2">готовность системы</text>
  <rect x="610" y="795" width="205" height="95" class="node admin" filter="url(#sh2)"/><text x="637" y="832" class="n1">Пользователи</text><text x="637" y="861" class="n2">роль, блок, пароль</text>
  <rect x="875" y="795" width="205" height="95" class="node admin" filter="url(#sh2)"/><text x="902" y="832" class="n1">Обучение</text><text x="902" y="861" class="n2">статистика</text>
  <rect x="1140" y="795" width="240" height="95" class="node admin" filter="url(#sh2)"/><text x="1167" y="832" class="n1">Контур</text><text x="1167" y="861" class="n2">health, сервисы, backup</text>
  <rect x="1440" y="795" width="185" height="95" class="node admin" filter="url(#sh2)"/><text x="1467" y="832" class="n1">Журнал</text><text x="1467" y="861" class="n2">поиск и фильтры</text>
  <rect x="1685" y="795" width="145" height="95" class="sync" filter="url(#sh2)"/><text x="1712" y="832" class="n1">Контроль</text><text x="1712" y="861" class="n2">след события</text>
  <path d="M270 842H330M550 842H610M815 842H875M1080 842H1140M1380 842H1440M1625 842H1685" class="edge"/>

  <rect x="55" y="970" width="1810" height="70" class="sync"/>
  <circle cx="95" cy="1005" r="14" class="bc"/><text x="89" y="1010" class="badge">1</text><text x="120" y="1011" class="legend">Единый вход и выбор UI по роли</text>
  <circle cx="610" cy="1005" r="14" class="bc"/><text x="604" y="1010" class="badge">2</text><text x="635" y="1011" class="legend">Общее состояние через PostgreSQL и API</text>
  <circle cx="1155" cy="1005" r="14" class="bc"/><text x="1149" y="1010" class="badge">3</text><text x="1180" y="1011" class="legend">Ошибки голосовых сервисов не скрываются</text>
</svg>
