<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура учебного тренажёра sys112</title>
  <desc id="desc">Схема показывает пользователей, единое веб-приложение, Nginx, API, голосовые сервисы, локальную модель и PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#13253e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#67e8f9"/></marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#f8fafc}.sub{font:400 21px Arial,sans-serif;fill:#b6c6da}.h{font:700 23px Arial,sans-serif;fill:#f8fafc}.t{font:400 17px Arial,sans-serif;fill:#dbe7f5}.s{font:400 14px Arial,sans-serif;fill:#9fb3c8}.box{fill:#162b47;stroke:#385576;stroke-width:2;rx:20}.user{fill:#183f55;stroke:#22d3ee;stroke-width:2}.voice{fill:#2b244d;stroke:#a78bfa;stroke-width:2}.data{fill:#173c35;stroke:#34d399;stroke-width:2}.line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#a78bfa;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.label{font:600 14px Arial,sans-serif;fill:#cffafe}.zone{fill:none;stroke:#45617f;stroke-width:2;stroke-dasharray:8 8;rx:28}.zone-title{font:700 16px Arial,sans-serif;fill:#8aa4be;letter-spacing:1px}.num{font:700 16px Arial,sans-serif;fill:#08111f}.circle{fill:#67e8f9}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="80" y="76" class="title">Архитектура sys112-trainer</text>
  <text x="80" y="112" class="sub">Фактический локальный контур демонстрации · единый web-интерфейс · 24.09.2026</text>

  <rect x="55" y="150" width="270" height="775" class="zone"/>
  <text x="80" y="182" class="zone-title">ПОЛЬЗОВАТЕЛИ</text>
  <rect x="85" y="225" width="210" height="125" rx="20" class="user" filter="url(#shadow)"/>
  <text x="110" y="268" class="h">Студент</text><text x="110" y="299" class="t">Тренировка и экзамен</text><text x="110" y="326" class="s">smirnova</text>
  <rect x="85" y="405" width="210" height="125" rx="20" class="user" filter="url(#shadow)"/>
  <text x="110" y="448" class="h">Преподаватель</text><text x="110" y="479" class="t">Назначение и контроль</text><text x="110" y="506" class="s">petrov</text>
  <rect x="85" y="585" width="210" height="125" rx="20" class="user" filter="url(#shadow)"/>
  <text x="110" y="628" class="h">Администратор</text><text x="110" y="659" class="t">Учётки и контур</text><text x="110" y="686" class="s">volkova</text>

  <rect x="370" y="150" width="420" height="775" class="zone"/>
  <text x="395" y="182" class="zone-title">БРАУЗЕР И ВХОДНОЙ ШЛЮЗ</text>
  <rect x="405" y="245" width="350" height="210" rx="24" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="440" y="292" class="h">student-web · React/Vite</text>
  <text x="440" y="330" class="t">Один SPA для трёх ролей</text>
  <text x="440" y="365" class="t">АРМ-112 · ДДС · преподаватель</text>
  <text x="440" y="400" class="t">администратор · Web Audio</text>
  <text x="440" y="431" class="s">Состояние вкладки + локальный fallback</text>
  <rect x="405" y="555" width="350" height="155" rx="22" class="box" filter="url(#shadow)"/>
  <text x="440" y="602" class="h">Nginx · :5173</text>
  <text x="440" y="637" class="t">Раздаёт SPA и проксирует</text>
  <text x="440" y="669" class="s">/api · /socket.io · /ws/stt · /ws/llm</text>

  <rect x="835" y="150" width="1015" height="775" class="zone"/>
  <text x="860" y="182" class="zone-title">ЛОКАЛЬНЫЕ СЕРВИСЫ И ДАННЫЕ</text>
  <rect x="880" y="230" width="390" height="180" rx="22" class="box" filter="url(#shadow)"/>
  <text x="915" y="276" class="h">NestJS API · :3000</text>
  <text x="915" y="312" class="t">Пользователи · назначения · результаты</text>
  <text x="915" y="344" class="t">live presence · записи · backup · audit</text>
  <text x="915" y="380" class="s">REST /api/v1 + Socket.IO /realtime</text>
  <rect x="1410" y="230" width="370" height="180" rx="22" class="data" filter="url(#shadow)"/>
  <text x="1445" y="276" class="h">PostgreSQL 16</text>
  <text x="1445" y="312" class="t">Учётки · билеты · занятия · WAV</text>
  <text x="1445" y="344" class="t">подсказки · оценки · журналы</text>
  <text x="1445" y="380" class="s">Docker volume sys112-pgdata</text>

  <rect x="880" y="520" width="250" height="170" rx="22" class="voice" filter="url(#shadow)"/>
  <text x="915" y="565" class="h">STT · :8090</text><text x="915" y="600" class="t">T-one, локально</text><text x="915" y="632" class="t">PCM → partial/final</text><text x="915" y="662" class="s">WebSocket /ws/stt</text>
  <rect x="1195" y="520" width="250" height="170" rx="22" class="voice" filter="url(#shadow)"/>
  <text x="1230" y="565" class="h">LLM · :8091</text><text x="1230" y="600" class="t">Менеджер диалога</text><text x="1230" y="632" class="t">реплики · анализ · билет</text><text x="1230" y="662" class="s">WebSocket /ws/llm</text>
  <rect x="1510" y="520" width="250" height="170" rx="22" class="voice" filter="url(#shadow)"/>
  <text x="1545" y="565" class="h">TTS · :8092</text><text x="1545" y="600" class="t">Silero, локально</text><text x="1545" y="632" class="t">текст → поток аудио</text><text x="1545" y="662" class="s">POST /api/v1/tts</text>
  <rect x="1195" y="770" width="250" height="110" rx="22" class="voice" filter="url(#shadow)"/>
  <text x="1230" y="815" class="h">llama.cpp · :8080</text><text x="1230" y="850" class="t">Qwen3-4B GGUF</text>

  <path d="M295 288 C350 288 350 320 405 320" class="line"/><path d="M295 468 C350 468 350 350 405 350" class="line"/><path d="M295 648 C350 648 350 380 405 380" class="line"/>
  <path d="M580 455 L580 555" class="line"/><path d="M755 625 C820 625 820 320 880 320" class="line"/>
  <path d="M1270 320 L1410 320" class="line"/><path d="M1410 350 L1270 350" class="line"/>
  <path d="M755 605 C820 605 820 605 880 605" class="line"/><path d="M755 625 C900 625 1050 605 1195 605" class="line"/><path d="M755 645 C980 645 1280 605 1510 605" class="line"/>
  <path d="M1320 690 L1320 770" class="dash"/>

  <rect x="80" y="965" width="1760" height="65" rx="18" fill="#0d1d31" stroke="#385576"/>
  <circle cx="120" cy="997" r="12" class="circle"/><text x="145" y="1003" class="t">Бирюзовая стрелка — сетевой запрос или поток данных</text>
  <path d="M680 997 L735 997" class="dash"/><text x="755" y="1003" class="t">Пунктир — LLM вызывает локальный inference</text>
  <text x="1320" y="1003" class="s">SIP, реальные ДДС и боевая сеть 112 не подключены</text>
</svg>
