map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  client_max_body_size 20m;

  location /api/v1/tts {
    proxy_pass http://tts:8092;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location /api/llm {
    proxy_pass http://llm:8091;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://api:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location /ws/stt {
    proxy_pass http://stt:8090/ws/stt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /ws/llm {
    proxy_pass http://llm:8091/ws/llm;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location = /stt-health {
    proxy_pass http://stt:8090/health;
  }

  location = /llm-health {
    proxy_pass http://llm:8091/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
