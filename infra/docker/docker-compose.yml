services:
  stt:
    build:
      context: ../..
      dockerfile: apps/stt/Dockerfile
    container_name: sys112-stt
    ports:
      - "8090:8090"
    environment:
      STT_MODE: local
      STT_MODEL_PATH: /models/sherpa-onnx-streaming-t-one-russian-2025-09-08
      STT_SAMPLE_RATE: "8000"
      STT_NUM_THREADS: "4"
      STT_DECODING_METHOD: greedy_search
      STT_ONNX_PROVIDER: cpu
    volumes:
      - ../../models:/models
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: sys112-llama
    command: >
      -m /models/Qwen3-4B-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096
      --jinja
      -ngl 0
    volumes:
      - ../../models/llm:/models
    ports:
      - "8080:8080"

  llm:
    build:
      context: ../..
      dockerfile: apps/llm/Dockerfile
    container_name: sys112-llm
    environment:
      LLM_MODE: local
      LLM_PROVIDER: local
      LLM_RUNTIME: llama_cpp
      LLM_MODEL_NAME: Qwen3-4B
      LLM_BASE_URL: http://llama:8080
      LLM_HOST: 0.0.0.0
      LLM_PORT: "8091"
    ports:
      - "8091:8091"
    depends_on:
      - llama

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sys112-postgres
    environment:
      POSTGRES_USER: sys112
      POSTGRES_PASSWORD: sys112
      POSTGRES_DB: sys112
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sys112 -d sys112"]
      interval: 5s
      timeout: 5s
      retries: 10
