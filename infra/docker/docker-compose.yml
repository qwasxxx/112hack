services:
  postgres:
    image: postgres:16-alpine
    container_name: sys112-postgres
    environment:
      POSTGRES_USER: sys112
      POSTGRES_PASSWORD: sys112
      POSTGRES_DB: sys112
    volumes:
      - sys112-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sys112 -d sys112"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: sys112-api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      DATABASE_URL: postgres://sys112:sys112@postgres:5432/sys112
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MIGRATIONS_DIR: /repo/infra/database/migrations
      STT_HEALTH_URL: http://stt:8090/health
      LLM_HEALTH_URL: http://llm:8091/health
      TTS_HEALTH_URL: http://tts:8092/health
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  stt:
    build:
      context: ../..
      dockerfile: apps/stt/Dockerfile
    container_name: sys112-stt
    environment:
      STT_MODE: ${STT_MODE:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      STT_HF_MODEL: ${STT_HF_MODEL:-openai/whisper-large-v3-turbo}
      STT_HF_LANGUAGE: russian
      STT_HOST: 0.0.0.0
      STT_PORT: "8090"
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  llm:
    build:
      context: ../..
      dockerfile: apps/llm/Dockerfile
    container_name: sys112-llm
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      LLM_RUNTIME: chat
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen/Qwen3.5-9B}
      HF_TOKEN: ${HF_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://router.huggingface.co}
      LLM_HOST: 0.0.0.0
      LLM_PORT: "8091"
      LLM_TEMPERATURE: "0.3"
      LLM_TOP_P: "0.8"
      LLM_MAX_TOKENS: "48"
    ports:
      - "8091:8091"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s
    restart: unless-stopped

  tts:
    build:
      context: ../..
      dockerfile: apps/tts/Dockerfile
    container_name: sys112-tts
    environment:
      TTS_HOST: 0.0.0.0
      TTS_PORT: "8092"
      TTS_LANGUAGE: ru
      TTS_BACKEND: ${TTS_BACKEND:-fish}
      FISH_API_KEY: ${FISH_API_KEY:-}
      FISH_MODEL: ${FISH_MODEL:-s2.1-pro}
      FISH_LATENCY: ${FISH_LATENCY:-normal}
      FISH_REFERENCE_ID: ${FISH_REFERENCE_ID:-}
      FISH_REFERENCE_AUDIO: ${FISH_REFERENCE_AUDIO:-}
      FISH_REFERENCE_TEXT: ${FISH_REFERENCE_TEXT:-}
    volumes:
      - tts-cache:/root/.cache
    ports:
      - "8092:8092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/student-web/Dockerfile
    container_name: sys112-web
    ports:
      - "5173:5173"
    depends_on:
      - api
      - stt
      - llm
      - tts
    restart: unless-stopped

volumes:
  sys112-pgdata:
  tts-cache:
